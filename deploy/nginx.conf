# Backend - api.gameroom.uz (HTTP)
server {
    listen 80;
    server_name api.gameroom.uz;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /home/www/e-hokimiyat-hatirchi/backend/staticfiles/;
    }

    location /media/ {
        alias /home/www/e-hokimiyat-hatirchi/backend/media/;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/home/www/e-hokimiyat-hatirchi/backend/gunicorn.sock;

        # WebSocket support (Chat uchun)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
# Frontend - gameroom.uz (HTTP)
server {
    listen 80;
    server_name gameroom.uz www.gameroom.uz;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
