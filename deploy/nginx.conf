# Backend - api.gameroom.uz (HTTP -> HTTPS)
server {
    listen 80;
    server_name api.gameroom.uz;

    return 301 https://$host$request_uri;
}

# Backend - api.gameroom.uz (HTTPS)
server {
    listen 443 ssl http2;
    server_name api.gameroom.uz;

    ssl_certificate /etc/letsencrypt/live/api.gameroom.uz-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gameroom.uz-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /home/www/e-hokimiyat-hatirchi/backend/staticfiles/;
    }

    location /media/ {
        alias /home/www/e-hokimiyat-hatirchi/backend/media/;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/home/www/e-hokimiyat-hatirchi/backend/gunicorn.sock;

        # WebSocket support (Chat uchun)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Frontend - gameroom.uz (HTTP -> HTTPS)
server {
    listen 80;
    server_name gameroom.uz www.gameroom.uz;

    return 301 https://$host$request_uri;
}

# Frontend - gameroom.uz (HTTPS)
server {
    listen 443 ssl http2;
    server_name gameroom.uz www.gameroom.uz;

    ssl_certificate /etc/letsencrypt/live/gameroom.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gameroom.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
